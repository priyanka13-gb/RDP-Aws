name: aws-resilient-delivery-platform

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://resilient_user@db:5432/resilient_db
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_TIMEOUT_SECONDS: "3"
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8).close()"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resilient_db
      POSTGRES_USER: resilient_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilient_user -d resilient_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

secrets:
  db_password:
    file: ./.secrets/db_password.txt

volumes:
  postgres_data:

networks:
  frontend:
  backend:
    internal: true
